apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-edge-cases
  labels:
    app: {{ .Release.Name }}-edge-cases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-edge-cases
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-edge-cases
    spec:
      initContainers:
        # list-item form ("- image:"), hardcoded in the template
        - image: busybox:1.36
          name: wait-for-api
          command: ["sh", "-c", "sleep 5"]
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        - name: legacy-worker
          image: {{ .Values.legacyWorker.image | quote }}
        - name: private-app
          image: {{ .Values.privateApp.image | quote }}
        - name: lookalike
          image: {{ .Values.lookalike.image | quote }}
        - name: pinned-proxy
          image: {{ .Values.pinnedProxy.image | quote }}
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
        - name: old-base
          image: "{{ .Values.oldBase.image.repository }}:{{ .Values.oldBase.image.tag }}"
          command: ["sleep", "infinity"]
        - name: pause
          image: {{ .Values.pause.image | quote }}
